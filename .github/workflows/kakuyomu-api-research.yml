name: Kakuyomu API Research

on:
  push:
    paths:
      - .github/workflows/kakuyomu-api-research.yml

permissions:
  contents: write

jobs:
  inspect-official-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download official Kakuyomu Viewer XAPK
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/139 Safari/537.36' \
            'https://d.apkpure.net/b/XAPK/jp.kadokawa.el.kakuyomu?version=latest' \
            -o /tmp/kakuyomu.xapk
          sha256sum /tmp/kakuyomu.xapk

      - name: Extract all APK payloads
        run: |
          set -euo pipefail
          mkdir -p /tmp/kakuyomu-xapk /tmp/kakuyomu-apks
          unzip -q /tmp/kakuyomu.xapk -d /tmp/kakuyomu-xapk
          count=0
          while IFS= read -r apk; do
            count=$((count + 1))
            dest="/tmp/kakuyomu-apks/apk-$count"
            mkdir -p "$dest"
            unzip -q "$apk" -d "$dest"
          done < <(find /tmp/kakuyomu-xapk -type f -name '*.apk' | sort)
          test "$count" -gt 0

      - name: Download JADX 1.5.6
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' \
            -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --version

      - name: Find base APK and decompile
        run: |
          set -euo pipefail
          BASE_APK="$(find /tmp/kakuyomu-xapk -type f -name '*.apk' -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$BASE_APK"
          echo "Decompiler input: $BASE_APK"
          mkdir -p /tmp/jadx-out
          /tmp/jadx/bin/jadx \
            --show-bad-code \
            --no-res \
            --threads-count 2 \
            -d /tmp/jadx-out \
            "$BASE_APK" || true

      - name: Extract sanitized API structure
        run: |
          set -euo pipefail
          mkdir -p docs/novelty
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_root = Path('/tmp/jadx-out/sources')
          findings = []
          target_terms = (
              '/api/app/works/', '/api/app/graphql', 'workFollow', 'workUnfollow',
              'FailedFollowWork', 'FailedUnfollowWork', 'VisitorWorkFollowing',
              'WorkFollowing', 'toggleFollow', 'DeleteReadingHistory',
              'EpisodeReadingHistory', 'VisitorReadingHistory',
          )

          http_annotation = re.compile(
              r'@(GET|POST|PUT|PATCH|DELETE|HTTP)\s*\(\s*"([^"]+)"'
          )
          retrofit_path = re.compile(r'@(?:Path|Query|Body|Field)\s*\(\s*"?([A-Za-z0-9_]+)"?')
          method_sig = re.compile(
              r'(?:public\s+)?(?:abstract\s+)?[A-Za-z0-9_.$<>?, @\[\]]+\s+'
              r'([A-Za-z_][A-Za-z0-9_]*)\s*\(([^;{]{0,800})\)'
          )
          string_path = re.compile(r'"(/api/app/[A-Za-z0-9_./{}?=&:%+-]{1,240})"')
          graphql_name = re.compile(
              r'\b(?:FollowUser|UnfollowUser|DeleteReadingHistory|[A-Za-z0-9_]*(?:WorkFollow|FollowWork|WorkUnfollow|UnfollowWork)[A-Za-z0-9_]*)\b'
          )

          for p in source_root.rglob('*.java'):
              try:
                  text = p.read_text('utf-8', errors='ignore')
              except OSError:
                  continue
              if not any(term in text for term in target_terms):
                  continue

              rel = str(p.relative_to(source_root))
              item = {'file': rel, 'http': set(), 'paths': set(), 'methods': set(), 'graphql': set()}

              for m in http_annotation.finditer(text):
                  item['http'].add(f'{m.group(1)} {m.group(2)}')
              for m in string_path.finditer(text):
                  item['paths'].add(m.group(1))
              for m in graphql_name.finditer(text):
                  item['graphql'].add(m.group(0))

              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if not any(term in line for term in target_terms):
                      continue
                  start = max(0, i - 8)
                  end = min(len(lines), i + 9)
                  block = '\n'.join(lines[start:end])
                  for hm in http_annotation.finditer(block):
                      item['http'].add(f'{hm.group(1)} {hm.group(2)}')
                  for mm in method_sig.finditer(block):
                      name = mm.group(1)
                      params = re.sub(r'\s+', ' ', mm.group(2)).strip()
                      if len(params) > 500:
                          params = params[:500]
                      item['methods'].add(f'{name}({params})')

              if item['http'] or item['paths'] or item['methods'] or item['graphql']:
                  findings.append(item)

          out = Path('docs/novelty/kakuyomu_api_static_research.txt')
          with out.open('w', encoding='utf-8') as f:
              f.write('Temporary structural result from the public official Kakuyomu Viewer APK.\n')
              f.write('Only endpoint annotations, method signatures, path literals, and operation identifiers are retained.\n\n')
              for item in sorted(findings, key=lambda x: x['file']):
                  f.write(f"=== {item['file']} ===\n")
                  for x in sorted(item['http']):
                      f.write(f'HTTP: {x}\n')
                  for x in sorted(item['paths']):
                      f.write(f'PATH: {x}\n')
                  for x in sorted(item['graphql']):
                      f.write(f'GRAPHQL_ID: {x}\n')
                  for x in sorted(item['methods']):
                      f.write(f'METHOD: {x}\n')
                  f.write('\n')
          PY
          cat docs/novelty/kakuyomu_api_static_research.txt

      - name: Commit sanitized research result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/novelty/kakuyomu_api_static_research.txt
          if git diff --cached --quiet; then
            echo 'No research result changes.'
            exit 0
          fi
          git commit -m 'chore: カクヨムAPI構造解析結果を更新'
          git push origin HEAD:develop
