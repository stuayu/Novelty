name: Kakuyomu API Research

on:
  push:
    paths:
      - .github/workflows/kakuyomu-api-research.yml

permissions:
  contents: write

jobs:
  inspect-official-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download official Kakuyomu Viewer XAPK
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/139 Safari/537.36' \
            'https://d.apkpure.net/b/XAPK/jp.kadokawa.el.kakuyomu?version=latest' \
            -o /tmp/kakuyomu.xapk
          echo "Downloaded bytes: $(stat -c %s /tmp/kakuyomu.xapk)"
          sha256sum /tmp/kakuyomu.xapk

      - name: Extract all APK payloads
        run: |
          set -euo pipefail
          mkdir -p /tmp/kakuyomu-xapk /tmp/kakuyomu-apks
          unzip -q /tmp/kakuyomu.xapk -d /tmp/kakuyomu-xapk
          find /tmp/kakuyomu-xapk -type f -name '*.apk' -printf '%s %p\n' | sort -nr
          count=0
          while IFS= read -r apk; do
            count=$((count + 1))
            dest="/tmp/kakuyomu-apks/apk-$count"
            mkdir -p "$dest"
            unzip -q "$apk" -d "$dest"
          done < <(find /tmp/kakuyomu-xapk -type f -name '*.apk' | sort)
          test "$count" -gt 0
          echo "Extracted APK count: $count"

      - name: Extract sanitized API identifiers
        run: |
          set -euo pipefail
          mkdir -p docs/novelty
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('/tmp/kakuyomu-apks')
          files = []
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              if (
                  p.suffix in {'.bundle', '.js', '.hbc', '.dex', '.json', '.so'}
                  or p.name.startswith('classes')
                  or p.name in {'index.android.bundle', 'main.jsbundle'}
              ):
                  files.append(p)

          urls = set()
          paths = set()
          operations = set()
          identifiers = set()
          candidate_files = []

          url_re = re.compile(rb'https?://[^\x00-\x20"\'<>]{4,240}')
          path_re = re.compile(rb'/(?:api|graphql)/?[A-Za-z0-9_./?=&:%+-]{0,180}')
          operation_re = re.compile(rb'\b(?:query|mutation|subscription)\s+([A-Za-z_][A-Za-z0-9_]{1,100})')
          identifier_re = re.compile(
              rb'\b[A-Za-z_][A-Za-z0-9_]{0,100}'
              rb'(?:Follow|follow|Unfollow|unfollow|Following|following|'
              rb'ReadingHistory|readingHistory|ReadHistory|readHistory|'
              rb'LastRead|lastRead|Antenna|antenna|EpisodeHistory|episodeHistory)'
              rb'[A-Za-z0-9_]{0,100}\b'
          )

          for p in files:
              try:
                  data = p.read_bytes()
              except OSError:
                  continue
              if any(k in data for k in (b'graphql', b'GraphQL', b'follow', b'Follow', b'history', b'History', b'/api/')):
                  candidate_files.append(str(p.relative_to(root)))
              for m in url_re.findall(data):
                  s = m.decode('utf-8', 'ignore')
                  if 'kakuyomu' in s.lower() or '/api/' in s.lower() or 'graphql' in s.lower():
                      urls.add(s)
              for m in path_re.findall(data):
                  paths.add(m.decode('utf-8', 'ignore'))
              for m in operation_re.findall(data):
                  operations.add(m.decode('utf-8', 'ignore'))
              for m in identifier_re.findall(data):
                  identifiers.add(m.decode('utf-8', 'ignore'))

          out = Path('docs/novelty/kakuyomu_api_static_research.txt')
          with out.open('w', encoding='utf-8') as f:
              f.write('Temporary static-analysis result from the public official Kakuyomu Viewer APK.\n')
              f.write('Only URLs, API paths, GraphQL operation names, and relevant identifiers are retained.\n\n')
              f.write('=== Candidate files ===\n')
              for x in sorted(candidate_files)[:400]:
                  f.write(x + '\n')
              f.write('\n=== URLs ===\n')
              for x in sorted(urls)[:1000]:
                  f.write(x + '\n')
              f.write('\n=== API paths ===\n')
              for x in sorted(paths)[:2000]:
                  f.write(x + '\n')
              f.write('\n=== GraphQL operations ===\n')
              for x in sorted(operations)[:2000]:
                  f.write(x + '\n')
              f.write('\n=== Follow / reading identifiers ===\n')
              for x in sorted(identifiers)[:4000]:
                  f.write(x + '\n')
          PY
          cat docs/novelty/kakuyomu_api_static_research.txt

      - name: Commit sanitized research result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/novelty/kakuyomu_api_static_research.txt
          if git diff --cached --quiet; then
            echo 'No research result changes.'
            exit 0
          fi
          git commit -m 'chore: カクヨムAPI静的解析結果を更新'
          git push origin HEAD:develop
