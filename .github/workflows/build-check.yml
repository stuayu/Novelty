name: Build Check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  android-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [debug, release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@651bceb6f9ca583f16b8d75b62c36ded2ae6fc9c # v4.0.0

      - name: Get Flutter packages
        run: mise run get

      - name: Run code generation
        run: mise run codegen

      - name: Build Android APK (${{ matrix.mode }})
        run: mise exec -- flutter build apk --${{ matrix.mode }}

      - name: Upload Android ${{ matrix.mode }} APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-${{ matrix.mode }}-apk
          path: build/app/outputs/flutter-apk/app-${{ matrix.mode }}.apk
          retention-days: 14

  ios-build:
    runs-on: macos-latest
    strategy:
      matrix:
        mode: [debug, release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: true

      - name: Get Flutter packages
        run: mise run get

      - name: Run code generation
        run: mise run codegen

      - name: Build iOS (${{ matrix.mode }}, unsigned)
        run: mise exec -- flutter build ios --${{ matrix.mode }} --no-codesign

      - name: Compress iOS ${{ matrix.mode }} build
        run: |
          cd build/ios/iphoneos
          zip -r Runner.app.zip Runner.app

      - name: Upload iOS ${{ matrix.mode }} build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-${{ matrix.mode }}-app
          path: build/ios/iphoneos/Runner.app.zip
          retention-days: 14
