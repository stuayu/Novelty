name: Kakuyomu Position Push Probe

on:
  push:
    branches:
      - research/kakuyomu-position-probe-20260822
    paths:
      - docs/novelty/kakuyomu_position_push_trigger.txt

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Extract compact viewer history evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          episode_url = (
              'https://kakuyomu.jp/works/2912051601045930861/'
              'episodes/2912051601046590969'
          )
          ua = (
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) '
              'AppleWebKit/537.36 (KHTML, like Gecko) '
              'Chrome/143.0.0.0 Safari/537.36'
          )

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': ua})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read().decode('utf-8', errors='replace')

          page = fetch(episode_url)
          scripts = []
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', page, re.I):
              absolute = urllib.parse.urljoin(episode_url, html.unescape(src))
              if urllib.parse.urlparse(absolute).netloc == 'cdn-static.kakuyomu.jp':
                  scripts.append(absolute)

          kakuyomu_js = next(
              (url for url in scripts if '/js/kakuyomu.js' in url),
              None,
          )
          if kakuyomu_js is None:
              raise SystemExit('kakuyomu.js not found')
          source = fetch(kakuyomu_js)

          lines = [
              f'capturedAt={datetime.now(timezone.utc).isoformat()}',
              f'episodeUrl={episode_url}',
              f'kakuyomuJs={kakuyomu_js}',
              '',
          ]

          body_match = re.search(
              r'data-viewer-history-path=["\']([^"\']+)["\']',
              page,
          )
          if body_match:
              lines.append(f'historyPath={html.unescape(body_match.group(1))}')
          lines.append('')

          tokens = [
              'viewer-history',
              'data-viewer-history-path',
              '/history',
              'historyPath',
              'position',
              'scrollTop',
              'scrollY',
              'ajax',
              'fetch(',
              'XMLHttpRequest',
              'js-episode-body',
          ]
          emitted = set()
          for token in tokens:
              start = 0
              occurrence = 0
              while occurrence < 12:
                  idx = source.lower().find(token.lower(), start)
                  if idx < 0:
                      break
                  occurrence += 1
                  left = max(0, idx - 1800)
                  right = min(len(source), idx + len(token) + 2800)
                  snippet = source[left:right]
                  key = re.sub(r'\s+', ' ', snippet[:250])
                  if key not in emitted:
                      emitted.add(key)
                      lines.extend([
                          f'=== {token} #{occurrence} ===',
                          snippet,
                          '',
                      ])
                  start = idx + len(token)

          output = Path('docs/novelty/kakuyomu_position_compact_evidence.txt')
          output.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit compact evidence
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/novelty/kakuyomu_position_compact_evidence.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "調査: viewer履歴通信の最小根拠を保存"
          git push origin HEAD:research/kakuyomu-position-probe-20260822
