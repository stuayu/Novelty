name: Kakuyomu API Probe

on:
  pull_request:
    branches: [develop]
    paths:
      - docs/novelty/kakuyomu_api_probe_trigger.txt

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}

      - name: Probe reading history position call site
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          pages = [
              'https://kakuyomu.jp/works/2912051601045930861',
              'https://kakuyomu.jp/works/2912051601045930861/episodes/2912051601046590969',
          ]
          ua = (
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) '
              'AppleWebKit/537.36 (KHTML, like Gecko) '
              'Chrome/143.0.0.0 Safari/537.36'
          )

          def fetch(url):
              request = urllib.request.Request(url, headers={'User-Agent': ua})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read().decode('utf-8', errors='replace')

          bundle_sources = {}
          for page_url in pages:
              page = fetch(page_url)
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', page):
                  absolute = urllib.parse.urljoin(page_url, html.unescape(src))
                  parsed = urllib.parse.urlparse(absolute)
                  if parsed.netloc != 'kakuyomu.jp' or '/_next/static/' not in absolute:
                      continue
                  if absolute not in bundle_sources:
                      try:
                          bundle_sources[absolute] = fetch(absolute)
                      except Exception:
                          pass

          lines = [
              f'capturedAt={datetime.now(timezone.utc).isoformat()}',
              f'bundleCount={len(bundle_sources)}',
              '',
              '=== episodeId / position near-pairs ===',
          ]

          seen = set()
          for url, source in bundle_sources.items():
              # 実callsiteを狙い、episodeId と position が近接する箇所だけを抽出する。
              for match in re.finditer(r'episodeId', source):
                  left = max(0, match.start() - 2500)
                  right = min(len(source), match.end() + 4000)
                  snippet = source[left:right]
                  if 'position' not in snippet:
                      continue
                  compact_key = snippet[:300]
                  if compact_key in seen:
                      continue
                  seen.add(compact_key)
                  lines.extend([
                      f'bundle={url}',
                      snippet,
                      '',
                  ])
                  if len(seen) >= 40:
                      break

          lines.append('=== position literals / builders ===')
          position_patterns = (
              r'position\s*:',
              r'["\']position["\']\s*:',
              r'position\s*=',
          )
          emitted = 0
          for url, source in bundle_sources.items():
              for pattern in position_patterns:
                  for match in re.finditer(pattern, source):
                      left = max(0, match.start() - 1800)
                      right = min(len(source), match.end() + 2800)
                      snippet = source[left:right]
                      if 'episode' not in snippet.lower() and 'reading' not in snippet.lower():
                          continue
                      lines.extend([
                          f'bundle={url}',
                          snippet,
                          '',
                      ])
                      emitted += 1
                      if emitted >= 40:
                          break
                  if emitted >= 40:
                      break
              if emitted >= 40:
                  break

          mutation = '''mutation RecordReadingHistory($input: RecordReadingHistoryInput!) {
            recordReadingHistory(input: $input) {
              clientMutationId
              __typename
            }
          }'''
          payload = json.dumps({
              'operationName': 'RecordReadingHistory',
              'variables': {'input': {}},
              'query': mutation,
          }).encode('utf-8')
          request = urllib.request.Request(
              'https://kakuyomu.jp/graphql?opname=RecordReadingHistory',
              data=payload,
              headers={
                  'Accept': 'application/json',
                  'Content-Type': 'application/json',
                  'Origin': 'https://kakuyomu.jp',
                  'Referer': pages[1],
                  'User-Agent': ua,
                  'X-Requested-With': 'XMLHttpRequest',
              },
              method='POST',
          )
          lines.append('=== server validation with empty input ===')
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  lines.append(f'status={response.status}')
                  lines.append(response.read().decode('utf-8', errors='replace'))
          except urllib.error.HTTPError as exc:
              lines.append(f'status={exc.code}')
              lines.append(exc.read().decode('utf-8', errors='replace'))
          except Exception as exc:
              lines.append(f'error={exc!r}')

          output = Path('docs/novelty/kakuyomu_reading_callsite_summary.txt')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit probe result to research branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/novelty/kakuyomu_reading_callsite_summary.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "調査: カクヨム読書位置position根拠を保存"
          git push origin HEAD:${{ github.head_ref }}
