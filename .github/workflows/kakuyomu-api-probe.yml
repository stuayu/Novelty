name: Kakuyomu API Probe

on:
  push:
    branches:
      - research/kakuyomu-position-probe-20260822
    paths:
      - docs/novelty/kakuyomu_api_probe_trigger.txt
      - .github/workflows/kakuyomu-api-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Probe Kakuyomu viewer history implementation
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          episode_url = (
              'https://kakuyomu.jp/works/2912051601045930861/'
              'episodes/2912051601046590969'
          )
          ua = (
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) '
              'AppleWebKit/537.36 (KHTML, like Gecko) '
              'Chrome/143.0.0.0 Safari/537.36'
          )

          def fetch(url):
              request = urllib.request.Request(url, headers={'User-Agent': ua})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read().decode('utf-8', errors='replace')

          page = fetch(episode_url)
          script_sources = {}
          allowed_hosts = {'kakuyomu.jp', 'cdn-static.kakuyomu.jp'}
          for src in re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              page,
              flags=re.IGNORECASE,
          ):
              absolute = urllib.parse.urljoin(episode_url, html.unescape(src))
              parsed = urllib.parse.urlparse(absolute)
              if parsed.netloc not in allowed_hosts:
                  continue
              try:
                  script_sources[absolute] = fetch(absolute)
              except Exception as exc:
                  script_sources[absolute] = f'FETCH_ERROR: {exc!r}'

          inline = '\n'.join(
              re.findall(
                  r'<script(?![^>]+src=)[^>]*>(.*?)</script>',
                  page,
                  flags=re.IGNORECASE | re.DOTALL,
              )
          )
          sources = {f'html:{episode_url}': page, f'inline:{episode_url}': inline}
          sources.update(script_sources)

          lines = [
              f'capturedAt={datetime.now(timezone.utc).isoformat()}',
              f'episodeUrl={episode_url}',
              f'scriptCount={len(script_sources)}',
              '',
              '=== first-party script URLs ===',
              *sorted(script_sources.keys()),
              '',
          ]

          tokens = (
              'data-viewer-history-path',
              'viewer-history',
              'historyPath',
              '/history',
              'reading_quantity',
              'position',
              'scrollTop',
              'getBoundingClientRect',
              'XMLHttpRequest',
              '$.ajax',
              'fetch(',
              'method:',
              'type:',
          )
          emitted = 0
          for source_url, source in sources.items():
              if source.startswith('FETCH_ERROR:'):
                  lines.extend([f'=== fetch error ===', source_url, source, ''])
                  continue
              lowered = source.lower()
              for token in tokens:
                  start = 0
                  occurrences = 0
                  needle = token.lower()
                  while occurrences < 20:
                      index = lowered.find(needle, start)
                      if index < 0:
                          break
                      occurrences += 1
                      left = max(0, index - 5000)
                      right = min(len(source), index + len(token) + 9000)
                      snippet = source[left:right]
                      nearby = snippet.lower()
                      if token in ('position', 'scrollTop', 'getBoundingClientRect', 'method:', 'type:'):
                          if not any(
                              marker in nearby
                              for marker in (
                                  'history',
                                  'viewer',
                                  'episode',
                                  'reading',
                              )
                          ):
                              start = index + len(token)
                              continue
                      lines.extend([
                          f'=== token={token} #{occurrences} ===',
                          f'source={source_url}',
                          snippet,
                          '',
                      ])
                      emitted += 1
                      start = index + len(token)
                      if emitted >= 160:
                          break
                  if emitted >= 160:
                      break
              if emitted >= 160:
                  break

          output = Path('docs/novelty/kakuyomu_reading_callsite_summary.txt')
          output.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit probe result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/novelty/kakuyomu_reading_callsite_summary.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "調査: カクヨムviewer履歴送信実装を保存"
          git push origin HEAD:research/kakuyomu-position-probe-20260822
