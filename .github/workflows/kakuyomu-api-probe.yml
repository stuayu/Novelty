name: Kakuyomu API Probe

on:
  pull_request:
    branches: [develop]
    paths:
      - docs/novelty/kakuyomu_api_probe_trigger.txt

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}

      - name: Extract viewer history implementation
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          episode_url = (
              'https://kakuyomu.jp/works/2912051601045930861/'
              'episodes/2912051601046590969'
          )
          ua = (
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) '
              'AppleWebKit/537.36 (KHTML, like Gecko) '
              'Chrome/143.0.0.0 Safari/537.36'
          )

          def fetch(url):
              request = urllib.request.Request(url, headers={'User-Agent': ua})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read().decode('utf-8', errors='replace')

          page = fetch(episode_url)
          history_match = re.search(
              r'data-viewer-history-path=["\']([^"\']+)["\']',
              page,
              flags=re.IGNORECASE,
          )
          quantity_match = re.search(
              r'data-viewer-reading-quantity-path=["\']([^"\']+)["\']',
              page,
              flags=re.IGNORECASE,
          )
          paragraph_ids = re.findall(
              r'<p\b[^>]*\bid=["\']([^"\']+)["\']',
              page,
              flags=re.IGNORECASE,
          )

          scripts = []
          for src in re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              page,
              flags=re.IGNORECASE,
          ):
              absolute = urllib.parse.urljoin(episode_url, html.unescape(src))
              parsed = urllib.parse.urlparse(absolute)
              if parsed.netloc not in {'kakuyomu.jp', 'cdn-static.kakuyomu.jp'}:
                  continue
              try:
                  scripts.append((absolute, fetch(absolute)))
              except Exception as exc:
                  scripts.append((absolute, f'FETCH_ERROR: {exc!r}'))

          lines = [
              f'capturedAt={datetime.now(timezone.utc).isoformat()}',
              f'episodeUrl={episode_url}',
              f'historyPath={history_match.group(1) if history_match else "NOT_FOUND"}',
              f'readingQuantityPath={quantity_match.group(1) if quantity_match else "NOT_FOUND"}',
              f'paragraphIds={paragraph_ids[:12]}',
              '',
              '=== first-party scripts ===',
          ]
          for url, source in scripts:
              lines.append(f'{url} length={len(source)}')
          lines.append('')

          # Legacy episode viewer is minified into kakuyomu.js.  Do not dump the
          # whole file: retain only compact contexts around highly specific
          # history/position markers so the result is human-reviewable.
          marker_groups = [
              ('viewer-history-path', ('viewer-history-path', 'viewerHistoryPath')),
              ('history request', ('/history', 'historyPath')),
              ('paragraph position', ('position', 'scrollTop', 'getBoundingClientRect')),
              ('request transport', ('XMLHttpRequest', '$.ajax', '.ajax(', 'fetch(')),
          ]
          emitted = set()
          context_count = 0
          for url, source in scripts:
              if source.startswith('FETCH_ERROR:'):
                  continue
              lower = source.lower()
              is_viewer_script = (
                  'kakuyomu.js' in url
                  or 'viewer-history' in lower
                  or 'viewerhistory' in lower
              )
              if not is_viewer_script:
                  continue
              for group_name, markers in marker_groups:
                  for marker in markers:
                      start = 0
                      marker_lower = marker.lower()
                      while context_count < 36:
                          index = lower.find(marker_lower, start)
                          if index < 0:
                              break
                          left = max(0, index - 1800)
                          right = min(len(source), index + len(marker) + 2600)
                          snippet = source[left:right]
                          nearby = snippet.lower()
                          # Generic markers are useful only when the same compact
                          # context is clearly tied to viewer/history/episode.
                          if group_name in {'paragraph position', 'request transport'}:
                              if not any(
                                  token in nearby
                                  for token in (
                                      'viewer-history',
                                      'viewerhistory',
                                      'history-path',
                                      '/history',
                                      'episode-body',
                                  )
                              ):
                                  start = index + len(marker)
                                  continue
                          key = (url, left // 500)
                          if key not in emitted:
                              emitted.add(key)
                              lines.extend([
                                  f'=== {group_name}: {marker} ===',
                                  f'source={url}',
                                  snippet,
                                  '',
                              ])
                              context_count += 1
                          start = index + len(marker)
                      if context_count >= 36:
                          break
                  if context_count >= 36:
                      break
              if context_count >= 36:
                  break

          # Extra targeted scan: if the data attribute string itself is present,
          # preserve a larger one-off context that should contain method/body and
          # position construction together.
          for url, source in scripts:
              if source.startswith('FETCH_ERROR:'):
                  continue
              lower = source.lower()
              candidates = [
                  lower.find('viewer-history-path'),
                  lower.find('viewerhistorypath'),
              ]
              index = next((value for value in candidates if value >= 0), -1)
              if index >= 0:
                  left = max(0, index - 5000)
                  right = min(len(source), index + 9000)
                  lines.extend([
                      '=== primary viewer-history implementation context ===',
                      f'source={url}',
                      source[left:right],
                      '',
                  ])
                  break

          output = Path('docs/novelty/kakuyomu_reading_callsite_summary.txt')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit compact probe result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/novelty/kakuyomu_reading_callsite_summary.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "調査: カクヨムviewer履歴実装をコンパクト抽出"
          git push origin HEAD:${{ github.head_ref }}
