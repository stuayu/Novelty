name: Kakuyomu API Probe

on:
  pull_request:
    branches: [develop]
    paths:
      - docs/novelty/kakuyomu_api_probe_trigger.txt

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}

      - name: Extract Kakuyomu GraphQL operation registry
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import json
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          work_url = 'https://kakuyomu.jp/works/2912051601045930861'
          user_agent = (
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) '
              'AppleWebKit/537.36 (KHTML, like Gecko) '
              'Chrome/143.0.0.0 Safari/537.36'
          )
          headers = {'User-Agent': user_agent}
          result = {
              'capturedAt': datetime.now(timezone.utc).isoformat(),
              'workUrl': work_url,
              'operations': [],
              'bundleUrls': [],
          }

          request = urllib.request.Request(work_url, headers=headers)
          with urllib.request.urlopen(request, timeout=30) as response:
              page = response.read().decode('utf-8', errors='replace')

          script_srcs = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', page)
          wanted_tokens = ('follow', 'reading', 'history', 'label')
          seen = set()

          for src in script_srcs:
              absolute = urllib.parse.urljoin(work_url, html.unescape(src))
              parsed_url = urllib.parse.urlparse(absolute)
              if parsed_url.netloc != 'kakuyomu.jp' or '/_next/static/' not in absolute:
                  continue

              try:
                  req = urllib.request.Request(absolute, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as response:
                      text = response.read().decode('utf-8', errors='replace')
              except Exception:
                  continue

              result['bundleUrls'].append(absolute)

              # operation registry はJS文字列内のJSONとして埋め込まれている。
              # エスケープされた引用符だけ1段戻し、各entryを抽出する。
              normalized = text.replace('\\"', '"')
              entry_pattern = re.compile(
                  r'"id":"(?P<id>[0-9a-f]+)",'
                  r'"name":"(?P<name>[^"]+)",'
                  r'"type":"(?P<type>query|mutation)",'
                  r'"body":"(?P<body>(?:\\.|[^"\\])*)"'
              )
              for match in entry_pattern.finditer(normalized):
                  name = match.group('name')
                  body_raw = match.group('body')
                  try:
                      body = json.loads('"' + body_raw + '"')
                  except json.JSONDecodeError:
                      body = body_raw.replace('\\n', '\n')
                  haystack = (name + '\n' + body).lower()
                  if not any(token in haystack for token in wanted_tokens):
                      continue
                  key = (name, match.group('type'))
                  if key in seen:
                      continue
                  seen.add(key)
                  result['operations'].append({
                      'id': match.group('id'),
                      'name': name,
                      'type': match.group('type'),
                      'body': body,
                      'bundleUrl': absolute,
                  })

          result['operations'].sort(key=lambda item: (item['type'], item['name']))
          output = Path('docs/novelty/kakuyomu_api_probe_result.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit probe result to research branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/novelty/kakuyomu_api_probe_result.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "調査: カクヨムoperation registryを保存"
          git push origin HEAD:${{ github.head_ref }}
