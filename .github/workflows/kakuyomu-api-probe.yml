name: Kakuyomu API Probe

on:
  pull_request:
    branches: [develop]
    paths:
      - docs/novelty/kakuyomu_api_probe_trigger.txt
      - .github/workflows/kakuyomu-api-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}

      - name: Probe reading history position call site
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          work_url = 'https://kakuyomu.jp/works/2912051601045930861'
          episode_url = (
              'https://kakuyomu.jp/works/2912051601045930861/'
              'episodes/2912051601046590969'
          )
          pages = [work_url, episode_url]
          ua = (
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) '
              'AppleWebKit/537.36 (KHTML, like Gecko) '
              'Chrome/143.0.0.0 Safari/537.36'
          )

          def fetch(url):
              request = urllib.request.Request(url, headers={'User-Agent': ua})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read().decode('utf-8', errors='replace')

          sources = {}
          inline_sources = {}
          page_html = {}
          allowed_hosts = {'kakuyomu.jp', 'cdn-static.kakuyomu.jp'}
          for page_url in pages:
              page = fetch(page_url)
              page_html[page_url] = page
              inline_sources[page_url] = '\n'.join(
                  re.findall(
                      r'<script(?![^>]+src=)[^>]*>(.*?)</script>',
                      page,
                      flags=re.IGNORECASE | re.DOTALL,
                  )
              )
              for src in re.findall(
                  r'<script[^>]+src=["\']([^"\']+)["\']',
                  page,
                  flags=re.IGNORECASE,
              ):
                  absolute = urllib.parse.urljoin(page_url, html.unescape(src))
                  parsed = urllib.parse.urlparse(absolute)
                  if parsed.netloc not in allowed_hosts:
                      continue
                  if absolute not in sources:
                      try:
                          sources[absolute] = fetch(absolute)
                      except Exception as exc:
                          sources[absolute] = f'FETCH_ERROR: {exc!r}'

          all_sources = dict(sources)
          for page_url, source in inline_sources.items():
              all_sources[f'inline:{page_url}'] = source

          lines = [
              f'capturedAt={datetime.now(timezone.utc).isoformat()}',
              f'scriptCount={len(sources)}',
              f'inlineSourceCount={len(inline_sources)}',
              '',
              '=== script URLs ===',
              *sorted(sources.keys()),
              '',
              '=== RecordReadingHistory / position evidence ===',
          ]

          evidence_count = 0
          tokens = (
              'RecordReadingHistory',
              'recordReadingHistory',
              'RecordReadingHistoryInput',
              'readingHistory',
              'episodeId',
              'position',
          )
          for url, source in all_sources.items():
              if source.startswith('FETCH_ERROR:'):
                  continue
              lowered = source.lower()
              if not any(token.lower() in lowered for token in tokens):
                  continue
              for token in tokens:
                  start = 0
                  occurrences = 0
                  while occurrences < 12:
                      index = lowered.find(token.lower(), start)
                      if index < 0:
                          break
                      occurrences += 1
                      left = max(0, index - 4500)
                      right = min(len(source), index + len(token) + 7500)
                      snippet = source[left:right]
                      # operation registryだけでなく、position/episodeの実処理を優先。
                      if token.lower() in {'episodeid', 'position'}:
                          nearby = snippet.lower()
                          if 'reading' not in nearby and 'record' not in nearby:
                              start = index + len(token)
                              continue
                      lines.extend([
                          f'--- token={token} ---',
                          f'source={url}',
                          snippet,
                          '',
                      ])
                      evidence_count += 1
                      start = index + len(token)
                      if evidence_count >= 100:
                          break
                  if evidence_count >= 100:
                      break
              if evidence_count >= 100:
                  break

          mutation = '''mutation RecordReadingHistory($input: RecordReadingHistoryInput!) {
            recordReadingHistory(input: $input) {
              clientMutationId
              __typename
            }
          }'''

          def validate_input(input_value, label):
              payload = json.dumps({
                  'operationName': 'RecordReadingHistory',
                  'variables': {'input': input_value},
                  'query': mutation,
              }).encode('utf-8')
              request = urllib.request.Request(
                  'https://kakuyomu.jp/graphql?opname=RecordReadingHistory',
                  data=payload,
                  headers={
                      'Accept': 'application/json',
                      'Content-Type': 'application/json',
                      'Origin': 'https://kakuyomu.jp',
                      'Referer': episode_url,
                      'User-Agent': ua,
                      'X-Requested-With': 'XMLHttpRequest',
                  },
                  method='POST',
              )
              lines.append(f'=== server validation: {label} ===')
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      lines.append(f'status={response.status}')
                      lines.append(response.read().decode('utf-8', errors='replace'))
              except urllib.error.HTTPError as exc:
                  lines.append(f'status={exc.code}')
                  lines.append(exc.read().decode('utf-8', errors='replace'))
              except Exception as exc:
                  lines.append(f'error={exc!r}')

          validate_input({}, 'empty input')
          # 既知の実episodeIdを使い、position文字列のサーバー側検証順だけ確認する。
          # 未認証なので状態変更は起きない。
          for value in ('', '0', 'p1', '#p1', 'top'):
              validate_input(
                  {'episodeId': '2912051601046590969', 'position': value},
                  f'position={value!r}',
              )

          output = Path('docs/novelty/kakuyomu_reading_callsite_summary.txt')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit probe result to research branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/novelty/kakuyomu_reading_callsite_summary.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "調査: カクヨム読書位置position根拠を保存"
          git push origin HEAD:${{ github.head_ref }}
