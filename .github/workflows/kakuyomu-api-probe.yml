name: Kakuyomu API Probe

on:
  pull_request:
    branches: [develop]
    paths:
      - docs/novelty/kakuyomu_api_probe_trigger.txt

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}

      - name: Probe Kakuyomu reading call sites
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          pages = [
              'https://kakuyomu.jp/works/2912051601045930861',
              'https://kakuyomu.jp/works/2912051601045930861/episodes/2912051601046590969',
          ]
          ua = (
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) '
              'AppleWebKit/537.36 (KHTML, like Gecko) '
              'Chrome/143.0.0.0 Safari/537.36'
          )
          tokens = (
              'RecordReadingHistory',
              'recordReadingHistory',
              'IncrementReadCount',
              'incrementReadCount',
          )

          def fetch(url):
              request = urllib.request.Request(url, headers={'User-Agent': ua})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read().decode('utf-8', errors='replace')

          bundle_sources = {}
          for page_url in pages:
              page = fetch(page_url)
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', page):
                  absolute = urllib.parse.urljoin(page_url, html.unescape(src))
                  parsed = urllib.parse.urlparse(absolute)
                  if parsed.netloc != 'kakuyomu.jp' or '/_next/static/' not in absolute:
                      continue
                  if absolute not in bundle_sources:
                      try:
                          bundle_sources[absolute] = fetch(absolute)
                      except Exception:
                          pass

          lines = [
              f'capturedAt={datetime.now(timezone.utc).isoformat()}',
              f'bundleCount={len(bundle_sources)}',
              '',
          ]
          for url, source in bundle_sources.items():
              for token in tokens:
                  start = 0
                  occurrence = 0
                  while occurrence < 12:
                      index = source.find(token, start)
                      if index < 0:
                          break
                      occurrence += 1
                      left = max(0, index - 2500)
                      right = min(len(source), index + len(token) + 4500)
                      snippet = source[left:right]
                      lines.extend([
                          f'=== {token} #{occurrence} ===',
                          f'bundle={url}',
                          snippet,
                          '',
                      ])
                      start = index + len(token)

          output = Path('docs/novelty/kakuyomu_reading_callsite_summary.txt')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit probe result to research branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/novelty/kakuyomu_reading_callsite_summary.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "調査: カクヨム読書履歴API呼び出し箇所を保存"
          git push origin HEAD:${{ github.head_ref }}