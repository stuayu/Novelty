name: novelty
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev
# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number for the application.
version: 1.4.0+146
environment:
  sdk: ^3.11.3
workspace:
  - packages/kakuyomu_parser
  - packages/narou_parser
  - packages/novel_parser_core
  - packages/tategaki

dependencies:
  archive: ^4.0.7
  dio: ^5.11.0
  drift: ^2.34.0
  dynamic_color: ^1.7.0
  file_picker: ^10.3.7
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.2
  flutter_inappwebview: ^6.1.5
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  hooks_riverpod: ^3.3.2
  html: ^0.15.6
  json_annotation: ^4.12.0
  kakuyomu_parser:
    path: packages/kakuyomu_parser
  narou_parser:
    path: packages/narou_parser
  path: ^1.9.0
  path_provider: ^2.1.6
  riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  shared_preferences: ^2.5.3
  tategaki:
    path: packages/tategaki
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: 2.15.1
  crypto: ^3.0.6
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter
  freezed: 3.2.6-dev.1
  go_router_builder: ^4.4.0
  json_serializable: ^6.14.1
  mockito: 5.6.4
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  riverpod_generator: 4.0.4
  riverpod_lint: 3.1.4
  sqlite3: ^3.5.0
  very_good_analysis: ^10.3.0

flutter:
  assets:
    - assets/app_icon/base.svg
    - assets/fonts/OFL.txt
  uses-material-design: true
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP.ttf
    - family: GenEiKoburiMincho
      fonts:
        - asset: assets/fonts/GenEiKoburiMin6-R.ttf
